name: Optional CUDA-Q CPU

on:
  # Conditional coverage keeps the measured ~2.33 GB optional install out of
  # existing jobs. See the two-runner measurements recorded on issue #138.
  pull_request:
    paths:
      - .github/workflows/cudaq-python.yml
      - pyproject.toml
      - uv.lock
      - Makefile
      - scripts/verify_cudaq.py
      - scripts/verify_notebooks.py
      - scripts/start_python_kernel.py
      - notebooks_py/2-QUBO_python.ipynb
      - notebooks_py/4-DWAVE_python.ipynb
      - tests/test_cudaq_qaoa.py
  push:
    branches: [main]
    paths:
      - .github/workflows/cudaq-python.yml
      - pyproject.toml
      - uv.lock
      - Makefile
      - scripts/verify_cudaq.py
      - scripts/verify_notebooks.py
      - scripts/start_python_kernel.py
      - notebooks_py/2-QUBO_python.ipynb
      - notebooks_py/4-DWAVE_python.ipynb
      - tests/test_cudaq_qaoa.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          # The cold sync measured 9.7–41.0 s; avoid a ~2.9 GB persistent cache.
          enable-cache: false
      - name: Install the QUBO notebook's integer-programming solver
        run: |
          sudo apt-get update
          sudo apt-get install -y glpk-utils
      - name: Verify the QAOA and quantum-annealing lessons on CPU
        run: make verify-cudaq-python
      - name: Check the compiled QAOA kernel against a dense reference
        run: env CUDA_VISIBLE_DEVICES="" OMP_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 uv run --locked --group docs --group qubo --group cudaq python -m unittest discover -s tests -p test_cudaq_qaoa.py
