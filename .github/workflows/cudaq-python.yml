name: Optional CUDA-Q CPU

on:
  # Conditional coverage keeps the measured ~2.33 GB optional install out of
  # existing jobs. See the two-runner measurements recorded on issue #138.
  pull_request:
    paths:
      - .github/workflows/cudaq-python.yml
      - pyproject.toml
      - uv.lock
      - Makefile
      - scripts/verify_cudaq.py
      - scripts/verify_notebooks.py
      - scripts/start_python_kernel.py
      - notebooks_py/4-DWAVE_python.ipynb
      - tests/test_cudaq_qaoa.py
      - tests/test_cudaq_optimization.py
      - tests/notebook_test_support.py
  push:
    branches: [main]
    paths:
      - .github/workflows/cudaq-python.yml
      - pyproject.toml
      - uv.lock
      - Makefile
      - scripts/verify_cudaq.py
      - scripts/verify_notebooks.py
      - scripts/start_python_kernel.py
      - notebooks_py/4-DWAVE_python.ipynb
      - tests/test_cudaq_qaoa.py
      - tests/test_cudaq_optimization.py
      - tests/notebook_test_support.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-24.04-arm
          - macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          # The cold sync measured 9.7–41.0 s; avoid a ~2.9 GB persistent cache.
          enable-cache: false
      - name: Verify annealing and QAOA in Lecture 4 on CPU
        run: make verify-cudaq-python
      - name: Check the compiled QAOA kernel against a dense reference
        run: make test-cudaq-python
      - name: Report CUDA-Q CPU platform, target, and verification summary
        run: |
          uv run --locked --group docs --group qubo --group cudaq python -c '
          import json, pathlib, platform, sys, cudaq
          cudaq.set_target("qpp-cpu")
          nb = json.loads(pathlib.Path(".nbverify/4-DWAVE_python.ipynb").read_text())
          text = "\n".join(
              "".join(item.get("text", []))
              for cell in nb["cells"]
              for item in cell.get("outputs", [])
              if item.get("output_type") == "stream"
          )
          checks = [
              line for line in text.splitlines()
              if "CUDA-Q" in line or "Using CUDA-Q" in line or "checks passed" in line
          ]
          print("os_platform:", platform.platform())
          print("architecture:", platform.machine())
          print("python_version:", sys.version.split()[0])
          print("cudaq_version:", getattr(cudaq, "__version__", "unknown"))
          print("cudaq_target:", cudaq.get_target().name)
          print("energy_and_feasibility_checks:", checks)
          '
