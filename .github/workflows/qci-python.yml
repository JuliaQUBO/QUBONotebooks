name: QCi Python local

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: notebooks_py/environments/qci/uv.lock
      - name: Test local QCi models and cloud boundaries
        run: make test-qci-python
      - name: Execute credential-free QCi notebook
        run: make verify-qci-python-local
