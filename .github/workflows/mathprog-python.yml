name: MathProg Python local

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked Python dependencies
        run: uv sync --locked --group docs --group mathprog
      - name: Install open-source solvers
        run: |
          sudo apt-get update
          sudo apt-get install -y glpk-utils libgfortran5 libgomp1 liblapack3 libblas3
          uv run --locked --group docs --group mathprog idaes get-extensions --release 3.4.2 --distro ubuntu2204 --to "$RUNNER_TEMP/mathprog-solvers"
          echo "$RUNNER_TEMP/mathprog-solvers" >> "$GITHUB_PATH"
      - name: Execute complete MathProg notebook
        env:
          QUBONOTEBOOKS_NOTEBOOK_TIMEOUT: "120"
        run: make verify-mathprog-python-local
      - name: Test result validation
        run: uv run --locked --group docs --group mathprog python -m unittest discover -s tests -p test_mathprog_python_local.py
