name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  verify:
    name: Python 3.12 / Julia 1.10
    runs-on: ubuntu-22.04
    env:
      UV_CACHE_DIR: .uv-cache
      JULIA_DEPOT_PATH: ${{ github.workspace }}/.julia-depot
      JULIA_PKG_PRECOMPILE_AUTO: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.10.11"

      - uses: julia-actions/cache@v3

      - name: Install system solvers
        run: |
          sudo apt-get update
          sudo apt-get install -y glpk-utils

      - name: Check Python lockfile
        run: uv lock --check

      - name: Link checks
        run: make test

      - name: Notebook output hygiene
        run: make check-notebook-output-hygiene

      - name: Notebook output budgets
        run: make check-notebook-output-budgets

      - name: Python unit tests
        run: make test-python PYTHON="uv run --locked --group docs python"

      - name: Julia link tests
        run: make test-julia

      - name: QCIOpt and DWave coexistence
        run: make test-qciopt-dwave-coexistence

      - name: QCI Julia notebook
        run: make verify-qci-julia-local

      - name: Portable Python notebooks
        run: make verify-python-portable

      - name: Portable Python figure reproducibility
        run: make check-figure-reproducibility

  output-churn:
    name: Notebook output churn (report only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The report walks every commit on the branch back to the merge base.
          fetch-depth: 0

      - name: Report notebook output churn
        # Informational: the report is not a merge gate.
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: make report-notebook-output-churn CHURN_BASE="origin/$BASE_REF" CHURN_HEAD="$HEAD_SHA"

  colab-bootstrap:
    name: Julia 1.12 Colab bootstrap
    runs-on: ubuntu-22.04
    env:
      UV_CACHE_DIR: .uv-cache
      JULIA_DEPOT_PATH: ${{ github.workspace }}/.julia-depot
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12.6"

      - uses: julia-actions/cache@v3

      - name: Julia 1.12 bootstrap tests
        run: make test-julia

      - name: Execute and inspect Colab bootstrap
        run: make verify-colab-bootstrap-output
